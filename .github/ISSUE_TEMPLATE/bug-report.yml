name: Bug report
description: Report a reproducible DeepSeek Harness Desktop problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, OAuth grants, workspace content, or other secrets.
  - type: input
    id: version
    attributes:
      label: DeepSeek Harness Desktop version
      placeholder: 0.1.0-community.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS arm64, macOS x64, Windows x64, Linux x64, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Attach only diagnostics exported by DeepSeek Harness Desktop after confirming that they contain no private data.
