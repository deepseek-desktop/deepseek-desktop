name: Community Build

on:
  pull_request:
  push:
    branches: [master]
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - run: apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: node scripts/ci-release-version.mjs
      - run: corepack pnpm@11.7.0 ci:shell-quality

  native-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: shell-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1
      - run: node scripts/ci-release-version.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - if: runner.os == 'Linux'
        run: corepack pnpm@11.7.0 package:community
        env:
          NO_STRIP: "1"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - if: runner.os == 'macOS'
        run: corepack pnpm@11.7.0 package:community
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP\ms-playwright"
          $buildRoot = "C:\d"
          if (Test-Path $buildRoot) {
            Remove-Item -Recurse -Force $buildRoot
          }
          git clone --no-hardlinks "$env:GITHUB_WORKSPACE" $buildRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Set-Location $buildRoot
          git checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          corepack pnpm@11.7.0 package:community
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Copy-Item -Recurse -Force "$buildRoot\release" "$env:GITHUB_WORKSPACE\release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deepseek-desktop-${{ matrix.name }}-unsigned-community
          path: |
            release/**/*.dmg
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/BUILD-INFO.*.json
            release/**/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: corepack pnpm@11.7.0 install --frozen-lockfile
      - run: node scripts/ci-release-version.mjs
      - run: corepack pnpm@11.7.0 app:sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deepseek-desktop-*-unsigned-community
          path: release-assets
          merge-multiple: true
      - name: Prepare release assets
        run: node scripts/prepare-ci-release-assets.mjs
      - name: Publish community release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product_name="$(node -p "require('./target/generated/app-config.json').productName")"
          mapfile -d '' assets < <(find release-assets/publish -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 6
          release_flags=()
          if [[ "${DESKTOP_RELEASE_PRERELEASE:-false}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$product_name ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes-community.md \
            "${release_flags[@]}" \
            --verify-tag
