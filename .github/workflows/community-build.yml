name: Community Build

on:
  pull_request:
  push:
    branches: [master]
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: node scripts/ci-release-version.mjs
      - run: corepack pnpm@11.7.0 ci:shell-quality

  native-build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: shell-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1
      - run: node scripts/ci-release-version.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/')
        run: corepack pnpm@11.7.0 package:community
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - if: runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/')
        run: corepack pnpm@11.7.0 desktop:package
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP\ms-playwright"
          $buildRoot = "C:\d"
          if (Test-Path $buildRoot) {
            Remove-Item -Recurse -Force $buildRoot
          }
          git clone --no-hardlinks "$env:GITHUB_WORKSPACE" $buildRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Set-Location $buildRoot
          git checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
            corepack pnpm@11.7.0 package:community
          } else {
            corepack pnpm@11.7.0 desktop:package
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Copy-Item -Recurse -Force "$buildRoot\release" "$env:GITHUB_WORKSPACE\release"
      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-desktop-${{ matrix.name }}-unsigned-community
          path: |
            release/**/*.dmg
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/BUILD-INFO.*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: corepack pnpm@11.7.0 install --frozen-lockfile
      - run: node scripts/ci-release-version.mjs
      - run: corepack pnpm@11.7.0 app:sync
      - uses: actions/download-artifact@v8
        with:
          pattern: deepseek-desktop-*-unsigned-community
          path: release-assets
          merge-multiple: true
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="release-assets/publish"
          mkdir -p "$publish_dir"
          mapfile -d '' assets < <(
            find release-assets -type f \
              ! -path "$publish_dir/*" \
              ! -name 'BUILD-INFO.*.json' \
              ! -name SHA256SUMS \
              -print0 | sort -z
          )
          test "${#assets[@]}" -gt 0

          declare -A asset_names=()
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            asset_name="${asset_name// /.}"
            if [[ -n "${asset_names[$asset_name]:-}" ]]; then
              echo "Duplicate release asset name: $asset_name" >&2
              exit 1
            fi
            asset_names[$asset_name]=1
            cp "$asset" "$publish_dir/$asset_name"
          done
          (
            cd "$publish_dir"
            sha256sum -- * | sort -k2 > SHA256SUMS
          )
          test -s "$publish_dir/SHA256SUMS"
      - name: Publish community release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product_name="$(node -p "require('./target/generated/app-config.json').productName")"
          mapfile -d '' assets < <(find release-assets/publish -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 1
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$product_name ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes-community.md \
            --prerelease \
            --verify-tag
