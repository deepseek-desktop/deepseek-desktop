name: Community Build

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*-community.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$package_version" = "$tauri_version"
          test "v$package_version" = "$GITHUB_REF_NAME"
      - run: pnpm check:i18n && pnpm test && pnpm typecheck && pnpm build
      - run: pnpm test:e2e

  native-build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: shell-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifactPath: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifactPath: src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifactPath: src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifactPath: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_CHANNEL: community
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir runtime install --frozen-lockfile
      - run: pnpm release:check $RELEASE_CHANNEL
        shell: bash
      - run: pnpm runtime:stage && pnpm runtime:verify ${{ matrix.target }}
        shell: bash
      - run: pnpm runtime:smoke
      - run: pnpm rust:test
      - run: pnpm rust:clippy
      - run: pnpm build
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/with-rust.mjs tauri build --bundles app --verbose

          product_name="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          app="src-tauri/target/release/bundle/macos/${product_name}.app"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) architecture="aarch64" ;;
            x86_64-apple-darwin) architecture="x64" ;;
            *) echo "Unsupported macOS target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac

          staging="$RUNNER_TEMP/deepseek-harness-desktop-dmg"
          output="src-tauri/target/release/bundle/dmg/${product_name}_${version}_${architecture}.dmg"
          if [ -e "$staging" ]; then
            find "$staging" -depth -delete
          fi
          mkdir -p "$staging" "$(dirname "$output")"
          ditto "$app" "$staging/${product_name}.app"
          ln -s /Applications "$staging/Applications"
          codesign --verify --deep --strict "$staging/${product_name}.app"
          hdiutil create \
            -srcfolder "$staging" \
            -volname "$product_name" \
            -fs HFS+ \
            -format UDZO \
            -ov "$output"
          hdiutil verify "$output"
      - if: runner.os == 'Linux'
        run: node scripts/with-rust.mjs tauri build --bundles deb
      - if: runner.os == 'Linux'
        run: node scripts/with-rust.mjs tauri build --bundles appimage --verbose
        env:
          NO_STRIP: "1"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst R: "$env:GITHUB_WORKSPACE"
          $exitCode = 1
          try {
            Set-Location R:\
            node scripts/with-rust.mjs tauri build --bundles ${{ matrix.bundles }}
            $exitCode = $LASTEXITCODE
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            subst R: /D
          }
          exit $exitCode
      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ matrix.name }}-unsigned-community
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deepseek-harness-desktop-*-unsigned-community
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="release-assets/publish"
          mkdir -p "$publish_dir"
          test -z "$(find "$publish_dir" -mindepth 1 -print -quit)"
          mapfile -d '' assets < <(
            find release-assets -type f ! -path "$publish_dir/*" ! -name SHA256SUMS -print0 | sort -z
          )
          test "${#assets[@]}" -gt 0

          declare -A asset_names=()
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            asset_name="${asset_name// /.}"
            if [[ -n "${asset_names[$asset_name]:-}" ]]; then
              echo "Duplicate release asset name: $asset_name" >&2
              exit 1
            fi
            asset_names[$asset_name]=1
            cp "$asset" "$publish_dir/$asset_name"
          done
          (
            cd "$publish_dir"
            sha256sum -- * | sort -k2 > SHA256SUMS
          )
          test -s "$publish_dir/SHA256SUMS"
      - name: Publish community release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product_name="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          mapfile -d '' assets < <(find release-assets/publish -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 1
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$product_name ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes-community.md \
            --prerelease \
            --verify-tag
