name: Community Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:i18n && pnpm test && pnpm typecheck && pnpm build
      - run: pnpm test:e2e

  native-build:
    needs: shell-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifactPath: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifactPath: src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifactPath: src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifactPath: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_CHANNEL: community
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir runtime install --frozen-lockfile
      - run: pnpm release:check $RELEASE_CHANNEL
        shell: bash
      - run: pnpm runtime:stage && pnpm runtime:verify ${{ matrix.target }}
        shell: bash
      - run: pnpm runtime:smoke
      - run: pnpm rust:test
      - run: pnpm rust:clippy
      - run: pnpm build
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            log="$RUNNER_TEMP/tauri-dmg-attempt-$attempt.log"
            status=0
            node scripts/with-rust.mjs tauri build --bundles ${{ matrix.bundles }} --verbose 2>&1 | tee "$log" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ] || ! grep -q 'hdiutil: detach: timeout' "$log"; then
              exit "$status"
            fi
            echo '::warning::Transient DMG detach timeout detected; cleaning the temporary image and retrying once.'
            for volume in /Volumes/dmg.*; do
              [ -d "$volume" ] || continue
              hdiutil detach "$volume" -force || true
            done
            find src-tauri/target/release/bundle/macos -maxdepth 1 -name 'rw.*.dmg' -delete
            find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -delete
            sleep 5
          done
      - if: runner.os == 'Linux'
        run: node scripts/with-rust.mjs tauri build --bundles deb
      - if: runner.os == 'Linux'
        run: node scripts/with-rust.mjs tauri build --bundles appimage --verbose
        env:
          NO_STRIP: "1"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst R: "$env:GITHUB_WORKSPACE"
          $exitCode = 1
          try {
            Set-Location R:\
            node scripts/with-rust.mjs tauri build --bundles ${{ matrix.bundles }}
            $exitCode = $LASTEXITCODE
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            subst R: /D
          }
          exit $exitCode
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-${{ matrix.name }}-unsigned-community
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
