packages:
  - .
  - packages/*

linkWorkspacePackages: true
nodeLinker: hoisted
autoInstallPeers: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  node-pty: true
  koffi: true
  node-addon-require-builtin: false
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - dshmarket@1.28.1
