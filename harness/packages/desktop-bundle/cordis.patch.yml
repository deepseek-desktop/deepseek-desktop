- id: credentials
  disabled: true

# Both search plugins stay loaded. They register providers into the same ctx.web registry
# under distinct ids, and WebRuntime.search() resolves exactly one of them per call from
# searchProvider below, so two enabled plugins never produce two searches. The desktop
# setting owns which id that is; see ADR-022.
- id: web
  inject:
    - webSearchSelection
  config:
    searchProvider: !!js ctx.get('webSearchSelection').searchProvider
    fetchProvider: http

- insert:
    - id: desktop-credentials-vault
      name: 'deepseek-desktop-credentials-vault'
    - id: web-search-selection
      name: '@deepseek-ai/dsh-web-search-follow-model/selection'
      config:
        mode: follow-model
    - id: web-search-follow-model
      name: '@deepseek-ai/dsh-web-search-follow-model'
