- id: credentials
  disabled: true

- id: web
  inject:
    - webSearchSelection
  config:
    searchProvider: !!js ctx.get('webSearchSelection').searchProvider
    fetchProvider: http

- insert:
    - id: desktop-credentials-vault
      name: 'deepseek-desktop-credentials-vault'
    - id: web-search-selection
      name: '@deepseek-ai/dsh-web-search-follow-model/selection'
      config:
        mode: follow-model
        independentProvider: deepseek-official
    - id: web-search-follow-model
      name: '@deepseek-ai/dsh-web-search-follow-model'
