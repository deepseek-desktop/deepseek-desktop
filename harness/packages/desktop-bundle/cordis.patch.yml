- id: credentials
  disabled: true

# The official plugin registers its own web_search tool. Running it next to the Desktop
# extension gives one conversation two competing search paths, so the desktop profile
# starts with it off. This bundle patch composes after dsh-base, which declares the
# entry; the web-search-follow-model setting owns the state afterwards and re-applies it
# to the loader on every activation.
- id: web-search-deepseek
  disabled: true

- id: web
  inject:
    - webSearchSelection
  config:
    searchProvider: !!js ctx.get('webSearchSelection').searchProvider
    fetchProvider: http

- insert:
    - id: desktop-credentials-vault
      name: 'deepseek-desktop-credentials-vault'
    - id: web-search-selection
      name: '@deepseek-ai/dsh-web-search-follow-model/selection'
      config:
        mode: follow-model
        independentProvider: deepseek-official
    - id: web-search-follow-model
      name: '@deepseek-ai/dsh-web-search-follow-model'
