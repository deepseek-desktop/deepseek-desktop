[package]
name = "deepseek-harness-desktop"
version = "0.1.0-community.3"
description = "Self-contained local desktop shell for DeepSeek Harness"
authors = ["SpringOpen Contributors"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deepseek-harness-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rfd = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chacha20poly1305 = "0.10"
fs2 = "0.4"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
